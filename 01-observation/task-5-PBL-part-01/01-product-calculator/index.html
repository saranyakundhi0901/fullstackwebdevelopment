<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Product Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="calculator-card">
    <h1>Product Total Calculator</h1>
    <p class="subtitle">Total updates instantly as you type — no page refresh needed.</p>

    <form id="calculator-form">
      <div class="field">
        <label for="product-name">Product Name</label>
        <input
          type="text"
          id="product-name"
          placeholder="e.g. Wireless Mouse"
          autocomplete="off"
        />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="quantity">Quantity</label>
          <input
            type="number"
            id="quantity"
            min="0"
            step="1"
            placeholder="0"
          />
        </div>

        <div class="field">
          <label for="price">Price per unit (₹)</label>
          <input
            type="number"
            id="price"
            min="0"
            step="0.01"
            placeholder="0.00"
          />
        </div>
      </div>

      <p id="error-message" class="error-message" aria-live="polite"></p>
    </form>

    <section class="result" aria-live="polite">
      <span class="result-label">Total for <strong id="result-product">—</strong></span>
      <span class="result-value">₹<span id="total-price">0.00</span></span>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
