<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the webpage responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile Manager</title>

    <!-- Linking the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main container for the Student Profile Manager -->
    <div class="container">

        <!-- Page heading -->
        <header>
            <h1>🎓 Student Profile Manager</h1>
            <p>Create and view a student profile dynamically using JavaScript</p>
        </header>

        <!-- Form section for entering student details -->
        <section class="form-card">

            <h2>Enter Student Details</h2>

            <div class="input-group">
                <label for="name">Student Name</label>
                <input type="text" id="name" placeholder="Enter student name">
            </div>

            <div class="input-group">
                <label for="roll">Roll Number</label>
                <input type="text" id="roll" placeholder="Enter roll number">
            </div>

            <div class="input-group">
                <label for="department">Department</label>
                <input type="text" id="department" placeholder="Enter department">
            </div>

            <div class="input-group">
                <label for="cgpa">CGPA</label>
                <input type="number" id="cgpa" step="0.01" min="0" max="10"
                       placeholder="Enter CGPA">
            </div>

            <!-- Button used to create the profile dynamically -->
            <button id="createBtn">Create Student Profile</button>

        </section>

        <!--
            This empty section acts as a container.
            JavaScript will dynamically create the student profile
            and insert it into this section.
        -->
        <section id="profileContainer"></section>

    </div>

    <!-- Linking the external JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
