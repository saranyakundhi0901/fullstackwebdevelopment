<!DOCTYPE html>
<html>
<head>
    <title>CSS Layout Practice</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 18px 40px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 17px;
        }

        /* Heading */
        h1 {
            margin: 25px;
            text-align: center;
        }

        h2 {
            margin-left: 25px;
        }

        /* FLEXBOX */
        .flex-container {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            gap: 20px;
            padding: 25px;
            background-color: #d9eaf7;
            margin: 20px;
        }

        .flex-card {
            width: 200px;
            height: 130px;
            background-color: #ffb347;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 3px 8px gray;
        }

        /* GRID */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 180px);
            gap: 20px;
            padding: 25px;
            margin: 20px;
            background-color: #dff3df;
            justify-content: center;
        }

        .grid-card {
            height: 120px;
            background-color: #ff6f61;
            color: white;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 3px 8px gray;
        }

        /* Another Grid */
        .small-grid {
            display: grid;
            grid-template-columns: repeat(2, 180px);
            gap: 15px;
            margin: 20px;
        }

        .small-box {
            height: 100px;
            background-color: #66c2d7;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a>
    </nav>

    <h1>CSS Layout Practice</h1>

    <!-- Flexbox -->
    <h2>Flexbox Layout</h2>

    <div class="flex-container">
        <div class="flex-card">Laptop</div>
        <div class="flex-card">Mobile</div>
        <div class="flex-card">Tablet</div>
    </div>

    <!-- Grid -->
    <h2>CSS Grid Layout</h2>

    <div class="grid-container">
        <div class="grid-card">Image 1</div>
        <div class="grid-card">Image 2</div>
        <div class="grid-card">Image 3</div>
        <div class="grid-card">Image 4</div>
        <div class="grid-card">Image 5</div>
        <div class="grid-card">Image 6</div>
    </div>

    <!-- Small Grid -->
    <h2>Two Column Grid</h2>

    <div class="small-grid">
        <div class="small-box">HTML</div>
        <div class="small-box">CSS</div>
        <div class="small-box">JavaScript</div>
        <div class="small-box">Node.js</div>
    </div>

</body>
</html>
